name: Private conduct contact request
description: Ask the maintainer to continue privately. Do not include report details.
title: "Private conduct contact requested"
body:
  - type: checkboxes
    id: privacy-check
    attributes:
      label: Keep the report private
      options:
        - label: I did not include report details or sensitive personal information in this public issue.
          required: true
  - type: input
    id: contact-method
    attributes:
      label: Preferred private contact
      description: Add a contact method you are comfortable publishing, or write "GitHub profile" after adding one there.
    validations:
      required: true
